name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, checkJs)
        run: npm run typecheck

      - name: Unit, DOM, patch and runtime smoke tests
        run: npm test
